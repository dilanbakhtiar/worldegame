<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Wordle Game</title>
	<link rel="stylesheet" href="static/style.css">
</head>
<body>
	<main class="game-shell">
		<header class="game-header">
			<div>
				<p class="eyebrow">Daily word puzzle</p>
				<h1>WORDLE</h1>
			</div>
			<div class="attempt-count"><span id="attempt-count">0</span> <span>/ 6</span></div>
		</header>

		<section class="intro" aria-labelledby="game-instructions">
			<p id="game-instructions">Guess the five-letter word in six tries.</p>
			<p class="tip">Green means right letter, right place. Yellow means right letter, wrong place.</p>
		</section>

		<section id="board" class="board" aria-label="Guess board">
		</section>

		<p id="message" class="message" role="status" hidden></p>

		<section id="answer-panel" class="answer-panel" aria-live="polite" hidden>
			<p id="answer-label" class="answer-label"></p>
			<strong id="answer"></strong>
			<button id="reset-button" type="button">Play again <span aria-hidden="true">&#8635;</span></button>
		</section>

		<form id="guess-form" class="guess-form">
			<label for="guess">Your next guess</label>
			<div class="form-row">
				<input id="guess" name="guess" type="text" minlength="5" maxlength="5"
					   pattern="[A-Za-z]{5}" autocomplete="off" autocapitalize="none"
					   placeholder="ENTER WORD" required autofocus>
				<button type="submit">Guess <span aria-hidden="true">&rarr;</span></button>
			</div>
		</form>

		<section class="keyboard" aria-label="Letter status keyboard">
			<div class="keyboard-row">
				<button class="key" type="button" data-letter="q">Q</button>
				<button class="key" type="button" data-letter="w">W</button>
				<button class="key" type="button" data-letter="e">E</button>
				<button class="key" type="button" data-letter="r">R</button>
				<button class="key" type="button" data-letter="t">T</button>
				<button class="key" type="button" data-letter="y">Y</button>
				<button class="key" type="button" data-letter="u">U</button>
				<button class="key" type="button" data-letter="i">I</button>
				<button class="key" type="button" data-letter="o">O</button>
				<button class="key" type="button" data-letter="p">P</button>
			</div>
			<div class="keyboard-row">
				<button class="key" type="button" data-letter="a">A</button>
				<button class="key" type="button" data-letter="s">S</button>
				<button class="key" type="button" data-letter="d">D</button>
				<button class="key" type="button" data-letter="f">F</button>
				<button class="key" type="button" data-letter="g">G</button>
				<button class="key" type="button" data-letter="h">H</button>
				<button class="key" type="button" data-letter="j">J</button>
				<button class="key" type="button" data-letter="k">K</button>
				<button class="key" type="button" data-letter="l">L</button>
			</div>
			<div class="keyboard-row">
				<button class="key" type="button" data-letter="z">Z</button>
				<button class="key" type="button" data-letter="x">X</button>
				<button class="key" type="button" data-letter="c">C</button>
				<button class="key" type="button" data-letter="v">V</button>
				<button class="key" type="button" data-letter="b">B</button>
				<button class="key" type="button" data-letter="n">N</button>
				<button class="key" type="button" data-letter="m">M</button>
			</div>
		</section>

		<footer class="legend" aria-label="Tile color legend">
			<span><i class="legend-swatch correct"></i>Correct</span>
			<span><i class="legend-swatch present"></i>Present</span>
			<span><i class="legend-swatch absent"></i>Absent</span>
		</footer>
	</main>
	<script src="static/game.js"></script>
</body>
</html>
